<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蕨積 - 植物AI助手</title>
    <script src="https://static.line-scdn.net/liff/edge/2.1/sdk.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2d5016 0%, #4a7c23 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 90%;
            max-width: 600px;
            height: 80vh;
            background: #f5f0e8;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: linear-gradient(135deg, #2d5016 0%, #4a7c23 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f0e8;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
        }
        .message.user { justify-content: flex-end; }
        .message.bot { justify-content: flex-start; }
        .message-content {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
            word-wrap: break-word;
        }
        .user .message-content {
            background: linear-gradient(135deg, #2d5016 0%, #4a7c23 100%);
            color: white;
        }
        .bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #ddd;
        }
        .chat-input-area {
            display: flex;
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
        }
        .chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 16px;
        }
        .send-button {
            margin-left: 10px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #2d5016 0%, #4a7c23 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
        }
        .send-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .system-message {
            text-align: center;
            font-size: 12px;
            color: #888;
            padding: 5px;
            font-style: italic;
        }
    </style>
</head>
<body><div class="chat-header">
    🌿 蕨積 - 你的植物好朋友
    <button id="logoutBtn" style="float: right; background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 10px; border-radius: 10px; cursor: pointer; font-size: 12px;">登出</button>
</div>
    <div class="chat-container">
        <div class="chat-header">
            🌿 蕨積 - 你的植物好朋友
        </div>
        <div class="chat-messages" id="messages">
            <div class="message bot">
                <div class="message-content">嗨！我是蕨積🌿<br>可以問我植物問題、查天氣～</div>
            </div>
        </div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="input" placeholder="輸入訊息..." disabled>
            <button class="send-button" id="sendBtn" disabled>發送</button>
        </div>
    </div>

    <script>
        var lineUserId = null;
        var isWaiting = false;
        var pollInterval = null;
        
        var messagesDiv = document.getElementById('messages');
        var inputEl = document.getElementById('input');
        var sendBtn = document.getElementById('sendBtn');
        
        var LIFF_ID = '{{ liff_id }}';
        document.getElementById('logoutBtn').addEventListener('click', function() {
    if (confirm('確定要登出嗎？')) {
        liff.logout();
        window.location.reload();
    }
});
        function addSystemMessage(text, isError) {
            var msgDiv = document.createElement('div');
            msgDiv.className = 'system-message';
            if (isError) msgDiv.style.color = '#c62828';
            msgDiv.innerText = text;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function showLoginButton() {
            messagesDiv.innerHTML = '';
            var container = document.createElement('div');
            container.style.cssText = 'display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; padding:20px;';
            container.innerHTML = '<div style="font-size:64px; margin-bottom:20px;">🌿</div>' +
                '<div style="text-align:center; margin-bottom:20px; color:#4a7c23;"><strong>歡迎來到蕨積</strong><br>請先登入 LINE 開始對話</div>' +
                '<button id="lineLoginBtn" style="padding:14px 28px; background:linear-gradient(135deg,#2d5016 0%,#4a7c23 100%); color:white; border:none; border-radius:30px; font-size:18px; cursor:pointer;">🔐 登入 LINE</button>';
            messagesDiv.appendChild(container);
            document.getElementById('lineLoginBtn').onclick = function() { liff.login(); };
        }
        
        async function initLIFF() {
            try {
                await liff.init({ liffId: LIFF_ID });
                
                if (!liff.isLoggedIn()) {
                    showLoginButton();
                    return;
                }
                
                var idToken = liff.getIDToken();
                if (!idToken) {
                    addSystemMessage('Cannot get ID token, please re-login', true);
                    liff.logout();
                    liff.login();
                    return;
                }
                
                var payloadBase64 = idToken.split('.')[1];
                var payloadJson = atob(payloadBase64);
                var payload = JSON.parse(payloadJson);
                var correctUserId = payload.sub;
                
                console.log('User ID from ID Token:', correctUserId);
                
                if (!correctUserId.startsWith('U')) {
                    console.error('Invalid User ID format:', correctUserId);
                    addSystemMessage('Invalid User ID format', true);
                    return;
                }
                
                lineUserId = correctUserId;
                console.log('Final User ID:', lineUserId);
                
                addSystemMessage('Connected! Start chatting.', false);
                inputEl.disabled = false;
                sendBtn.disabled = false;
                
                startPolling();
                
            } catch (error) {
                console.error('LIFF init error:', error);
                addSystemMessage('Connection failed, please refresh', true);
            }
        }
        
        function startPolling() {
    if (pollInterval) clearInterval(pollInterval);
    
    pollInterval = setInterval(async function() {
        if (!lineUserId) return;
        
        try {
            var response = await fetch('/webchat/reply?user_id=' + lineUserId);
            var data = await response.json();
            
            if (data.has_reply) {
                // 移除 Thinking 訊息
                var tempMsg = document.getElementById('temp-message');
                if (tempMsg) tempMsg.remove();
                
                // 顯示 AI 回覆
                addMessage(data.reply, 'bot');
                isWaiting = false;
                sendBtn.disabled = false;
            }
        } catch (error) {
            console.error('Polling error:', error);
        }
    }, 1500);
}
        
       async function sendMessage() {
    if (!lineUserId) {
        alert('Please login to LINE first');
        return;
    }
    
    var message = inputEl.value.trim();
    if (!message || isWaiting) return;
    
    addMessage(message, 'user');
    inputEl.value = '';
    
    isWaiting = true;
    sendBtn.disabled = true;
    var thinkingMsg = addMessage('Thinking...', 'bot', true);
    
    try {
        var response = await fetch('/webchat/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: lineUserId, message: message })
        });
        
        var data = await response.json();
        console.log('Send response:', data);
        
        if (!data.success) {
            if (thinkingMsg) thinkingMsg.remove();
            addMessage('Failed: ' + (data.error || 'Unknown error'), 'bot');
            isWaiting = false;
            sendBtn.disabled = false;
        }
        // 成功時保留 Thinking，等輪詢取代
        
    } catch (error) {
        console.error('Send error:', error);
        if (thinkingMsg) thinkingMsg.remove();
        addMessage('Network error', 'bot');
        isWaiting = false;
        sendBtn.disabled = false;
    }
}
        
        function addMessage(text, sender, isTemp) {
            var messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + sender;
            messageDiv.innerHTML = '<div class="message-content">' + text.replace(/\n/g, '<br>') + '</div>';
            
            if (isTemp) {
                messageDiv.id = 'temp-message';
            }
            
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        sendBtn.addEventListener('click', sendMessage);
        inputEl.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !inputEl.disabled) sendMessage();
        });
        
        initLIFF();
    </script>
</body>
</html>
